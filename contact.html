<script>
    // Create interactive particles that scatter on mouse movement
    const backdrop = document.querySelector('.backdrop');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    
    const particles = [];

    // Create particle elements
    function createParticles() {
        const particleCount = 30;
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'interactive-particle';
            
            const startX = Math.random() * window.innerWidth;
            const startY = Math.random() * window.innerHeight;
            
            particle.style.left = startX + 'px';
            particle.style.top = startY + 'px';
            
            particles.push({
                element: particle,
                x: startX,
                y: startY,
                baseX: startX,
                baseY: startY,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                offsetX: 0,
                offsetY: 0
            });
            
            backdrop.appendChild(particle);
        }
    }

    // Animate particles with floating and cursor interaction
    function animateParticles() {
        const time = Date.now() * 0.001;
        
        particles.forEach((p) => {
            // Floating animation using sine waves
            const floatX = Math.sin(time * 0.5 + p.x) * 20;
            const floatY = Math.cos(time * 0.3 + p.y) * 20;
            
            p.element.style.left = (p.baseX + floatX + p.offsetX) + 'px';
            p.element.style.top = (p.baseY + floatY + p.offsetY) + 'px';
        });
        
        requestAnimationFrame(animateParticles);
    }

    // Track mouse movement
    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;

        particles.forEach((p) => {
            const rect = p.element.getBoundingClientRect();
            const partX = rect.left + rect.width / 2;
            const partY = rect.top + rect.height / 2;

            const distance = Math.sqrt(Math.pow(mouseX - partX, 2) + Math.pow(mouseY - partY, 2));
            const angle = Math.atan2(partY - mouseY, partX - mouseX);

            if (distance < 200) {
                const force = (200 - distance) / 200;
                p.offsetX = Math.cos(angle) * force * 150;
                p.offsetY = Math.sin(angle) * force * 150;
            } else {
                p.offsetX *= 0.9;
                p.offsetY *= 0.9;
            }
        });
    });

    createParticles();
    animateParticles();
</script>
